name: Prepare release

on:
  push:
    tags:
      - "*"
  workflow_call:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write # IMPORTANT: mandatory for sigstore in build.yml

  create-release:
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: release-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Notes are generated by GitHub and grouped by PR labels (.github/release.yml).
          # A stable release is compared with the previous stable tag, so it also lists
          # changes already shipped in its pre-releases (e.g. 0.19.a1, 0.19.rc1).
          prerelease_pattern='(a|b|rc|alpha|beta|dev)[0-9]*$'
          if [[ "$TAG" =~ $prerelease_pattern ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            previous=$(git tag --sort=-creatordate | grep -vxF "$TAG" | head -n 1)
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            previous=$(git tag --sort=-creatordate | grep -vxF "$TAG" | grep -vE "$prerelease_pattern" | head -n 1)
          fi
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            ${previous:+-f previous_tag_name="$previous"} \
            --jq .body > RELEASE_NOTES.md
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Release
        id: create-draft-release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/*
          draft: true
          prerelease: ${{ steps.release-notes.outputs.prerelease }}
          body_path: RELEASE_NOTES.md
      - name: Summary
        run: |
          echo "# Release summary" >> $GITHUB_STEP_SUMMARY
          echo "Url: ${{ steps.create-draft-release.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "You can now publish the release on GitHub" >> $GITHUB_STEP_SUMMARY
